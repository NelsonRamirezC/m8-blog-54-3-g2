<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios | M8 Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7fb;
        }

        .page-header {
            background: linear-gradient(120deg, #12355b, #087e8b);
        }

        .avatar {
            width: 48px;
            height: 48px;
            object-fit: cover;
        }

        .users-table thead th {
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <header class="page-header text-white py-5">
        <div class="container">
            <p class="text-uppercase small fw-semibold mb-2 opacity-75">M8 Blog</p>
            <h1 class="display-6 fw-bold mb-2">Usuarios registrados</h1>
            <p class="lead mb-0">Consulta los perfiles disponibles en la comunidad.</p>
        </div>
    </header>

    <main class="container py-4 py-md-5">
        <section class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 p-4 border-bottom">
                    <div>
                        <h2 class="h4 mb-1">Directorio de usuarios</h2>
                        <p class="text-secondary mb-0" id="user-count">Cargando usuarios...</p>
                    </div>
                    <button class="btn btn-outline-primary" type="button" id="reload-users">
                        Actualizar
                    </button>
                </div>

                <div id="status" class="p-4" aria-live="polite">
                    <div class="d-flex align-items-center gap-2 text-secondary">
                        <div class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></div>
                        <span>Cargando usuarios...</span>
                    </div>
                </div>

                <div class="table-responsive d-none" id="table-container">
                    <table class="table table-hover align-middle mb-0 users-table">
                        <thead class="table-light">
                            <tr>
                                <th scope="col" class="ps-4">Avatar</th>
                                <th scope="col">ID</th>
                                <th scope="col">Nombre</th>
                                <th scope="col" class="pe-4">Correo electrónico</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script>
        const defaultAvatar = "/assets/img/default-avatar.png";
        const status = document.querySelector("#status");
        const tableContainer = document.querySelector("#table-container");
        const tableBody = document.querySelector("#users-table-body");
        const userCount = document.querySelector("#user-count");

        const showStatus = (message, type = "secondary") => {
            status.className = "p-4";
            status.innerHTML = `<p class="text-${type} mb-0">${message}</p>`;
            status.classList.remove("d-none");
            tableContainer.classList.add("d-none");
        };

        const loadUsers = async () => {
            showStatus("<span class=\"spinner-border spinner-border-sm me-2\" role=\"status\" aria-hidden=\"true\"></span>Cargando usuarios...");
            userCount.textContent = "Cargando usuarios...";

            try {
                const response = await fetch("/api/usuarios");
                if (!response.ok) {
                    throw new Error("No fue posible obtener los usuarios.");
                }

                const data = await response.json();
                const users = Array.isArray(data.usuarios) ? data.usuarios : [];
                tableBody.innerHTML = "";

                users.forEach((user) => {
                    const row = document.createElement("tr");
                    const avatarUrl = user.urlImagen || defaultAvatar;
                    row.innerHTML = `
						<td class="ps-4">
							<img class="avatar rounded-circle border" src="${avatarUrl}" alt="Avatar de ${user.nombre || "usuario"}"
								onerror="this.onerror=null; this.src='${defaultAvatar}'">
						</td>
						<td>${user.id}</td>
						<td class="fw-semibold">${user.nombre || "Sin nombre"}</td>
						<td class="pe-4">${user.email || "Sin correo"}</td>
					`;
                    tableBody.appendChild(row);
                });

                userCount.textContent = `${users.length} usuario${users.length === 1 ? "" : "s"}`;
                status.classList.add("d-none");
                if (users.length > 0) {
                    tableContainer.classList.remove("d-none");
                } else {
                    showStatus("No hay usuarios registrados.");
                }
            } catch (error) {
                userCount.textContent = "No se pudieron cargar los usuarios";
                showStatus(`${error.message} Intenta nuevamente.`, "danger");
            }
        };

        document.querySelector("#reload-users").addEventListener("click", loadUsers);
        loadUsers();
    </script>
</body>

</html>
